<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Kart Raycaster</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 4px solid #333;
        }
        canvas {
            display: block;
            background: #87CEEB;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
        .item-box {
            width: 50px;
            height: 50px;
            border: 3px solid #fff;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        #instructions {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="640" height="400"></canvas>
    <div id="ui">
        <div>
            <div id="lap-display">LAP: 1 / 3</div>
            <div id="pos-display">POS: 4/4</div>
            <div id="speed-display">SPEED: 0</div>
        </div>
        <div>
            <div style="font-size: 12px; margin-bottom: 2px;">ITEM</div>
            <div class="item-box" id="item-display">-</div>
        </div>
    </div>
</div>

<div id="instructions">
    <strong>Arrows / WASD:</strong> Steer & Accelerate | <strong>SPACE:</strong> Use Item | <strong>SHIFT:</strong> Drift
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State
const ROAD_LENGTH = 2000;
const SEGMENT_LENGTH = 100;
const TOTAL_SEGMENTS = ROAD_LENGTH / SEGMENT_LENGTH;
const LANES = 3;

let player = {
    x: 0, // -1 to 1 (left to right)
    z: 0, // distance along track
    speed: 0,
    maxSpeed: 80,
    accel: 0.4,
    braking: 0.8,
    decel: 0.2,
    angle: 0,
    drift: 0,
    lap: 1,
    item: null,
    spinTime: 0,
    boostTime: 0
};

let bots = [
    { x: -0.5, z: 200, speed: 65, color: '#FF3333', lap: 1, targetLane: -0.5 },
    { x: 0.5, z: 400, speed: 60, color: '#3333FF', lap: 1, targetLane: 0.5 },
    { x: 0, z: 600, speed: 70, color: '#33FF33', lap: 1, targetLane: 0 }
];

let itemsOnTrack = []; // { x, z, type }
let activeShells = []; // { x, z, vx, vz, owner }

let keys = {};
window.addEventListener('keydown', e => {
    if(e.code === 'Space' && player.item && player.spinTime === 0) {
        useItem();
        e.preventDefault();
    }
    keys[e.code] = true;
});
window.addEventListener('keyup', e => keys[e.code] = false);

// Track generation (curves and hills)
let track = [];
for(let i = 0; i < TOTAL_SEGMENTS; i++) {
    let curve = 0;
    let hill = Math.sin(i / 15) * 800;
    if (i > 20 && i < 50) curve = 1.5;
    if (i > 80 && i < 120) curve = -2;
    track.push({ index: i, curve: curve, hill: hill, color: (Math.floor(i/3)%2) ? '#228B22' : '#006400', roadColor: (Math.floor(i/2)%2) ? '#555' : '#444' });
}

function useItem() {
    if (player.item === 'MUSHROOM') {
        player.boostTime = 90; // frames
    } else if (player.item === 'BANANA') {
        itemsOnTrack.push({ x: player.x, z: player.z - 50, type: 'BANANA' });
    } else if (player.item === 'SHELL') {
        activeShells.push({ x: player.x, z: player.z + 50, vx: 0, vz: 4, owner: 'player' });
    }
    player.item = null;
}

function update() {
    // Spin / Boost effects
    if (player.spinTime > 0) {
        player.spinTime--;
        player.speed = 2;
        player.angle += 0.3;
        return;
    }

    let accelFactor = 1;
    if (player.boostTime > 0) {
        player.boostTime--;
        accelFactor = 2.0;
    }

    // Input handling
    let steer = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) steer = -0.03;
    if (keys['ArrowRight'] || keys['KeyD']) steer = 0.03;

    if (keys['ArrowUp'] || keys['KeyW']) {
        player.speed = Math.min(player.maxSpeed * accelFactor, player.speed + player.accel);
    } else if (keys['ArrowDown'] || keys['KeyS']) {
        player.speed = Math.max(0, player.speed - player.braking);
    } else {
        player.speed = Math.max(0, player.speed - player.decel);
    }

    // Drifting mechanic
    if (keys['ShiftLeft'] && Math.abs(steer) > 0) {
        player.drift += steer * 1.5;
    } else {
        player.drift *= 0.9;
    }

    player.x += steer + player.drift;
    player.x = Math.max(-1.8, Math.min(1.8, player.x));
    player.z += player.speed;

    // Lap completion
    if (player.z >= ROAD_LENGTH) {
        player.z -= ROAD_LENGTH;
        player.lap++;
    }

    // Update Bots
    bots.forEach(bot => {
        bot.speed = 65 + Math.sin(bot.z * 0.01) * 5;
        bot.z += bot.speed;
        if (bot.z >= ROAD_LENGTH) {
            bot.z -= ROAD_LENGTH;
            bot.lap++;
        }
        // AI steering towards target lane
        if (Math.random() < 0.02) bot.targetLane = (Math.random() - 0.5) * 2;
        bot.x += (bot.targetLane - bot.x) * 0.05;

        // Bot item collision with banana
        itemsOnTrack.forEach((item, idx) => {
            if (item.type === 'BANANA' && Math.abs(bot.x - item.x) < 0.3 && Math.abs(bot.z - bot.z) < 50) {
                itemsOnTrack.splice(idx, 1);
                bot.speed = 10; // spin out penalty
            }
        });
    });

    // Update Shells
    for (let i = activeShells.length - 1; i >= 0; i--) {
        let shell = activeShells[i];
        shell.z += shell.vz;
        if (shell.z >= ROAD_LENGTH) shell.z -= ROAD_LENGTH;

        // Check player collision with shell
        if (Math.abs(player.x - shell.x) < 0.4 && Math.abs(player.z - shell.z) < 30) {
            player.spinTime = 45;
            activeShells.splice(i, 1);
            continue;
        }

        // Check bot collision
        let hitBot = false;
        bots.forEach(bot => {
            if (Math.abs(bot.x - shell.x) < 0.4 && Math.abs(bot.z - shell.z) < 30) {
                bot.speed = 5;
                hitBot = true;
            }
        });
        if (hitBot) {
            activeShells.splice(i, 1);
            continue;
        }
    }

    // Check Banana collisions for player
    itemsOnTrack.forEach((item, idx) => {
        if (item.type === 'BANANA' && Math.abs(player.x - item.x) < 0.3 && Math.abs(player.z - item.z) < 30) {
            itemsOnTrack.splice(idx, 1);
            player.spinTime = 45;
        }
    });

    // Random Item Box collection (simulate hitting boxes along track edges)
    if (!player.item && Math.random() < 0.01) {
        const types = ['MUSHROOM', 'BANANA', 'SHELL'];
        player.item = types[Math.floor(Math.random() * types.length)];
    }

    // UI Updates
    document.getElementById('speed-display').innerText = `SPEED: ${Math.floor(player.speed)}`;
    document.getElementById('lap-display').innerText = `LAP: ${Math.min(3, player.lap)} / 3`;
    
    // Calculate Position
    let standings = [{z: player.z + (player.lap * ROAD_LENGTH), isPlayer: true}];
    bots.forEach(b => standings.push({z: b.z + (b.lap * ROAD_LENGTH), isPlayer: false}));
    standings.sort((a,b) => b.z - a.z);
    let myPos = standings.findIndex(s => s.isPlayer) + 1;
    document.getElementById('pos-display').innerText = `POS: ${myPos}/4`;

    let itemEl = document.getElementById('item-display');
    itemEl.innerText = player.item ? (player.item === 'MUSHROOM' ? '🍄' : player.item === 'BANANA' ? '🍌' : '🐢') : '-';
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let baseSegmentIdx = Math.floor(player.z / SEGMENT_LENGTH);
    let basePercent = (player.z % SEGMENT_LENGTH) / SEGMENT_LENGTH;

    let maxDrawDistance = 120;
    let x = 0;
    let dx = 0;
    let y = 0;

    // --- Draw Background Scenery (Sky & Hills) ---
    ctx.fillStyle = '#4682B4';
    ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
    ctx.fillStyle = '#32CD32';
    ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

    let currentSegment = track[baseSegmentIdx % TOTAL_SEGMENTS];
    let heritageHill = currentSegment.hill;

    // --- Render Road Segments (Painter's Algorithm Back-to-Front) ---
    let renderList = [];

    for(let n = maxDrawDistance - 1; n > 0; n--) {
        let segmentIdx = (baseSegmentIdx + n) % TOTAL_SEGMENTS;
        let segment = track[segmentIdx];
        
        dx += segment.curve;
        x += dx;

        let camZ = n * SEGMENT_LENGTH - (basePercent * SEGMENT_LENGTH);
        if (camZ <= 0) continue;

        let scale = 200 / camZ;
        let screenX = (canvas.width / 2) + (x * scale) - (player.x * scale * 50);
        let screenY = (canvas.height / 2) + (segment.hill - heritageHill) * scale * 0.05 + (scale * 10);
        let screenW = scale * 400;

        renderList.push({ segment, screenX, screenY, screenW, scale, segmentIdx });
    }

    // Draw Road from back to front
    for (let i = renderList.length - 1; i >= 0; i--) {
        let curr = renderList[i];
        let next = renderList[i - 1];
        if (!next) break;

        // Draw grass background
        ctx.fillStyle = curr.segment.color;
        ctx.fillRect(0, curr.screenY, canvas.width, next.screenY - curr.screenY + 1);

        // Draw Road
        ctx.fillStyle = curr.segment.roadColor;
        ctx.beginPath();
        ctx.moveTo(curr.screenX - curr.screenW, curr.screenY);
        ctx.lineTo(curr.screenX + curr.screenW, curr.screenY);
        ctx.lineTo(next.screenX + next.screenW, next.screenY);
        ctx.lineTo(next.screenX - next.screenW, next.screenY);
        ctx.fill();

        // Draw center dashed lines
        ctx.fillStyle = '#FFFFFF';
        let rumbleW = curr.screenW / 10;
        ctx.fillRect(curr.screenX - rumbleW/2, curr.screenY, rumbleW, next.screenY - curr.screenY);
    }

    // --- Render Objects (Bots, Items, Shells) ---
    // Combine all entities to sort by depth
    let entities = [];
    bots.forEach(b => {
        let dz = b.z - player.z;
        if (dz < 0) dz += ROAD_LENGTH;
        entities.push({ type: 'bot', obj: b, z: dz });
    });
    itemsOnTrack.forEach(item => {
        let dz = item.z - player.z;
        if (dz < 0) dz += ROAD_LENGTH;
        entities.push({ type: 'item', obj: item, z: dz });
    });
    activeShells.forEach(shell => {
        let dz = shell.z - player.z;
        if (dz < 0) dz += ROAD_LENGTH;
        entities.push({ type: 'shell', obj: shell, z: dz });
    });

    entities.sort((a, b) => b.z - a.z);

    entities.forEach(ent => {
        if (ent.z < 10 || ent.z > maxDrawDistance * SEGMENT_LENGTH) return;
        let scale = 200 / ent.z;
        let screenX = (canvas.width / 2) + ((ent.obj.x - player.x) * scale * 200);
        let screenY = (canvas.height / 2) + 30; // approximate vertical alignment

        if (ent.type === 'bot') {
            // Draw Kart Body
            ctx.fillStyle = ent.obj.color;
            ctx.fillRect(screenX - 15 * scale, screenY - 15 * scale, 30 * scale, 20 * scale);
            // Kart Head (Driver)
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(screenX, screenY - 20 * scale, 8 * scale, 0, Math.PI * 2);
            ctx.fill();
        } else if (ent.type === 'item') {
            // Draw Banana
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(screenX - 5 * scale, screenY, 10 * scale, 6 * scale);
        } else if (ent.type === 'shell') {
            // Draw Shell
            ctx.fillStyle = '#00FF00';
            ctx.beginPath();
            ctx.arc(screenX, screenY, 6 * scale, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // --- Render Player Kart (Foreground sprite) ---
    ctx.fillStyle = '#FF4500';
    ctx.fillRect(canvas.width / 2 - 25, canvas.height - 70, 50, 30);
    ctx.fillStyle = '#FFA500';
    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height - 80, 12, 0, Math.PI * 2);
    ctx.fill();
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
