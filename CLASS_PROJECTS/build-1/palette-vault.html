<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palette Vault</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --bg-surface-hover: #334155;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: rgba(99, 102, 241, 0.15);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-primary); color: var(--text-main); font-family: var(--font); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: var(--bg-surface); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(8px); }
    .header-container { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .logo-group { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(139, 92, 246, 0.4); }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; background: linear-gradient(to right, #ffffff, #94a3b8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-tabs { display: flex; background-color: var(--bg-primary); padding: 0.25rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 0.5rem 1.25rem; font-size: 0.9rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.5rem; }
    .tab-btn.active { background-color: var(--accent); color: #ffffff; box-shadow: 0 2px 6px rgba(99, 102, 241, 0.4); }
    .tab-btn:hover:not(.active) { color: var(--text-main); background-color: rgba(255, 255, 255, 0.05); }
    main { max-width: 1200px; width: 100%; margin: 0 auto; padding: 2rem 1.5rem; flex: 1; }
    .view-panel { display: none; animation: fadeIn 0.3s ease; }
    .view-panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .controls-card { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 2rem; display: flex; flex-direction: column; gap: 1rem; box-shadow: var(--shadow); }
    .controls-row-top { display: flex; gap: 1rem; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 240px; position: relative; }
    .search-input { width: 100%; background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 0.65rem 1rem; color: var(--text-main); font-size: 0.95rem; transition: border-color 0.2s; }
    .search-input:focus { outline: none; border-color: var(--accent); }
    .sort-box { display: flex; align-items: center; gap: 0.5rem; }
    .select-input { background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 0.65rem 1rem; color: var(--text-main); font-size: 0.9rem; cursor: pointer; outline: none; }
    .select-input:focus { border-color: var(--accent); }
    .category-pills { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.25rem; }
    .pill-btn { background-color: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.4rem 0.85rem; border-radius: 20px; font-size: 0.85rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .pill-btn:hover { border-color: var(--text-muted); color: var(--text-main); }
    .pill-btn.active { background-color: var(--accent-light); border-color: var(--accent); color: #a5b4fc; }
    .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .palette-card { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); transition: transform 0.2s ease, border-color 0.2s ease; }
    .palette-card:hover { transform: translateY(-4px); border-color: #475569; }
    .swatch-container { height: 140px; display: flex; width: 100%; cursor: pointer; position: relative; }
    .swatch-bar { height: 100%; flex: 1; transition: flex 0.2s ease; position: relative; }
    .swatch-bar:hover { flex: 1.8; }
    .swatch-bar .color-code { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65); color: #fff; font-size: 0.7rem; font-family: monospace; padding: 2px 4px; border-radius: 4px; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; }
    .swatch-bar:hover .color-code { opacity: 1; }
    .card-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; flex: 1; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); line-height: 1.3; }
    .card-category { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.2rem 0.5rem; background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-muted); white-space: nowrap; }
    .card-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
    .card-date { font-size: 0.75rem; opacity: 0.85; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: auto; }
    .tag-item { font-size: 0.75rem; color: var(--text-muted); background-color: rgba(255, 255, 255, 0.03); padding: 0.1rem 0.4rem; border-radius: 4px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 0.75rem; border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: 0.25rem; gap: 0.5rem; flex-wrap: wrap; }
    .action-group { display: flex; gap: 0.4rem; align-items: center; }
    .like-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.35rem 0.75rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; transition: all 0.2s; }
    .like-btn:hover { border-color: #f43f5e; color: #f43f5e; background-color: rgba(244, 63, 94, 0.1); }
    .like-btn.liked { background-color: rgba(244, 63, 94, 0.15); border-color: #f43f5e; color: #f43f5e; }
    .like-btn svg { width: 14px; height: 14px; fill: currentColor; }
    .empty-state { text-align: center; padding: 4rem 2rem; background-color: var(--bg-surface); border: 1px dashed var(--border-color); border-radius: var(--radius); grid-column: 1 / -1; }

    /* Form Styles */
    .form-container { max-width: 650px; margin: 0 auto; background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 2rem; box-shadow: var(--shadow); }
    .form-header { margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
    .form-group { margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text-main); display: flex; justify-content: space-between; }
    .char-limit { font-weight: normal; color: var(--text-muted); font-size: 0.75rem; }
    input[type="text"], textarea, select { background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 0.75rem 1rem; color: var(--text-main); font-size: 0.95rem; width: 100%; outline: none; transition: border-color 0.2s; font-family: var(--font); }
    input[type="text"]:focus, textarea:focus, select:focus { border-color: var(--accent); }
    .colors-section { background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 1.25rem; margin-bottom: 1.5rem; }
    .colors-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .colors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 0.75rem; }
    .color-picker-item { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; position: relative; }
    .color-picker-wrapper { width: 100%; height: 50px; border-radius: 6px; overflow: hidden; border: 2px solid var(--border-color); position: relative; cursor: pointer; }
    .color-picker-wrapper input[type="color"] { position: absolute; top: -10px; left: -10px; width: 200%; height: 200%; cursor: pointer; border: none; }
    .color-hex-text { font-size: 0.75rem; font-family: monospace; color: var(--text-muted); text-transform: uppercase; }
    .remove-color-btn { position: absolute; top: -6px; right: -6px; background-color: var(--danger); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .add-color-btn { background-color: transparent; border: 1px dashed var(--border-color); color: var(--accent); padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .submit-btn { width: 100%; background-color: var(--accent); color: white; border: none; border-radius: var(--radius-sm); padding: 0.85rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
    .submit-btn:hover { background-color: var(--accent-hover); }

    /* Modals */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 200; padding: 1rem; }
    .modal-overlay.active { display: flex; }
    .modal-content { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius); width: 100%; max-width: 650px; padding: 1.5rem; box-shadow: var(--shadow); max-height: 85vh; display: flex; flex-direction: column; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; margin-bottom: 1rem; }
    .close-modal { background: none; border: none; color: var(--text-muted); font-size: 1.25rem; cursor: pointer; }
    .comments-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1rem; padding-right: 0.5rem; }
    
    /* Threaded Comments & Action Controls */
    .comment-item { background-color: var(--bg-primary); border: 1px solid var(--border-color); padding: 0.85rem; border-radius: var(--radius-sm); font-size: 0.88rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .comment-thread { border-left: 2px solid var(--border-color); padding-left: 0.75rem; margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.2rem; }
    .comment-author { font-weight: 600; color: var(--accent); }
    .comment-actions { display: flex; gap: 0.35rem; align-items: center; }

    /* Action Pills */
    .action-pill { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.2rem 0.55rem; border-radius: 12px; font-size: 0.75rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 0.2rem; }
    .action-pill:hover { border-color: var(--accent); color: var(--text-main); background-color: var(--accent-light); }
    .action-pill.danger:hover { border-color: var(--danger); color: var(--danger); background-color: rgba(239, 68, 68, 0.1); }

    /* Inline Forms */
    .reply-form-container, .edit-form-container { margin-top: 0.6rem; padding: 0.75rem; background: var(--bg-surface); border-radius: var(--radius-sm); border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 0.5rem; }

    /* Shared Confirm Modal */
    .confirm-modal-content { background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius); width: 100%; max-width: 400px; padding: 1.5rem; text-align: center; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 1rem; }
    .confirm-actions { display: flex; gap: 0.75rem; justify-content: center; }
    .btn-danger { background-color: var(--danger); color: white; border: none; border-radius: var(--radius-sm); padding: 0.5rem 1.25rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
    .btn-danger:hover { background-color: var(--danger-hover); }

    .toast { position: fixed; bottom: 20px; right: 20px; background-color: #10b981; color: white; padding: 0.75rem 1.25rem; border-radius: var(--radius-sm); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); font-size: 0.9rem; font-weight: 500; transform: translateY(100px); opacity: 0; transition: all 0.3s ease; z-index: 1000; }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo-group">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 c.92 0 1.7-.75 1.7-1.67 0-.42-.16-.82-.44-1.12-.27-.3-.43-.7-.43-1.13 0-.92.75-1.67 1.67-1.67H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9z"/></svg>
        </div>
        <h1>Palette Vault</h1>
      </div>
      <nav class="nav-tabs">
        <button class="tab-btn active" id="tab-explore" onclick="switchView('explore')">Explore</button>
        <button class="tab-btn" id="tab-create" onclick="switchView('create')">Create New</button>
      </nav>
    </div>
  </header>

  <main>
    <div id="view-explore" class="view-panel active">
      <div class="controls-card">
        <div class="controls-row-top">
          <div class="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="Search by title or tags..." oninput="handleSearchChange()">
          </div>
          <div class="sort-box">
            <select id="sort-select" class="select-input" onchange="handleSortChange()">
              <option value="newest">Sort by: Newest</option>
              <option value="likes">Sort by: Most Liked</option>
            </select>
          </div>
        </div>
        <div class="category-pills" id="category-pills">
          <button class="pill-btn active" onclick="handleCategorySelect('All')">All Vibes</button>
          <button class="pill-btn" onclick="handleCategorySelect('Pastel')">Pastel</button>
          <button class="pill-btn" onclick="handleCategorySelect('Minimal')">Minimal</button>
          <button class="pill-btn" onclick="handleCategorySelect('Neon')">Neon</button>
          <button class="pill-btn" onclick="handleCategorySelect('Dark')">Dark</button>
          <button class="pill-btn" onclick="handleCategorySelect('Vibrant')">Vibrant</button>
        </div>
      </div>

      <div class="palette-grid" id="palette-grid"></div>
    </div>

    <div id="view-create" class="view-panel">
      <div class="form-container">
        <div class="form-header">
          <h2>Create New Palette</h2>
          <p>Share your color harmony with designers and creators worldwide.</p>
        </div>

        <form id="palette-form" onsubmit="handleFormSubmit(event)">
          <div class="form-row">
            <div class="form-group">
              <label for="title">Palette Title <span class="char-limit">max 40</span></label>
              <input type="text" id="title" maxlength="40" placeholder="e.g. Neon Sunset" required>
            </div>
            <div class="form-group">
              <label for="creator_name">Creator Name <span class="char-limit">max 25</span></label>
              <input type="text" id="creator_name" maxlength="25" placeholder="e.g. Alex" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="category">Category / Vibe</label>
              <select id="category" required>
                <option value="" disabled selected>Select a vibe...</option>
                <option value="Pastel">Pastel</option>
                <option value="Minimal">Minimal</option>
                <option value="Neon">Neon</option>
                <option value="Dark">Dark</option>
                <option value="Vibrant">Vibrant</option>
              </select>
            </div>
            <div class="form-group">
              <label for="tags">Tags <span class="char-limit">max 60</span></label>
              <input type="text" id="tags" maxlength="60" placeholder="e.g. retro, chill, web3" required>
            </div>
          </div>

          <div class="colors-section">
            <div class="colors-header">
              <label>Palette Colors <span style="font-weight: normal; color: var(--text-muted);">(3 to 10 choices)</span></label>
              <button type="button" class="add-color-btn" id="add-color-btn" onclick="addColorPicker()">+ Add Color</button>
            </div>
            <div class="colors-grid" id="colors-picker-grid"></div>
          </div>

          <button type="submit" id="submit-btn" class="submit-btn">Publish Palette</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Comments Thread Modal -->
  <div class="modal-overlay" id="comments-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-palette-title">Comments Thread</h3>
        <button class="close-modal" onclick="closeCommentsModal()">✕</button>
      </div>
      
      <div class="comments-list" id="comments-list"></div>

      <form onsubmit="handleCommentSubmit(event, null)" style="display: flex; flex-direction: column; gap: 0.5rem; border-top: 1px solid var(--border-color); padding-top: 0.75rem;">
        <input type="text" id="comment-author" placeholder="Your name" maxlength="25" required style="padding: 0.5rem 0.75rem;">
        <div style="display: flex; flex-direction: column; gap: 0.2rem;">
          <textarea id="comment-content" placeholder="Write a root comment... (max 280 chars)" maxlength="280" rows="2" required style="padding: 0.5rem 0.75rem; resize: none;"></textarea>
          <span style="font-size: 0.75rem; color: var(--text-muted); align-self: flex-end;">Max 280 chars</span>
        </div>
        <button type="submit" class="submit-btn" style="padding: 0.5rem;">Post Comment</button>
      </form>
    </div>
  </div>

  <!-- Styled Universal Delete Confirmation Modal -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="confirm-modal-content">
      <h3 id="confirm-modal-title">Delete Item?</h3>
      <p id="confirm-modal-desc" style="color: var(--text-muted); font-size: 0.9rem;">Are you sure you want to delete this item? This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="btn-danger" id="confirm-delete-btn">Delete</button>
        <button class="pill-btn" onclick="closeConfirmModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <span id="toast-message">Action successful!</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="palette-data.js"></script>
</body>
</html>
