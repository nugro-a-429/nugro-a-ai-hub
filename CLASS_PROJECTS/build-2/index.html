<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound Share</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .brand {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .brand h1 {
      font-size: 1.75rem;
      color: var(--text-main);
    }

    .brand p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      color: var(--text-muted);
    }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 0.75rem;
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    button {
      flex: 1;
      padding: 0.75rem;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary { background-color: var(--accent); color: white; }
    .btn-primary:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: transparent; border: 1px solid var(--border); color: var(--text-main); }
    .btn-danger { background-color: var(--danger); color: white; margin-top: 1.5rem; width: 100%; }

    .alert {
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    .alert-danger { background-color: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; }
    .alert-success { background-color: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: #6ee7b7; }

    .hidden { display: none !important; }

    .user-badge {
      background-color: #0f172a;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .upload-section {
      background-color: #0f172a;
      padding: 1.25rem;
      border-radius: 8px;
      border: 1px dashed var(--border);
      margin-bottom: 1.5rem;
    }

    .clip-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1rem;
    }

    .clip-item {
      background-color: #0f172a;
      padding: 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .clip-item h4 {
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }

    audio {
      width: 100%;
      height: 36px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="container">
    <div class="brand">
      <h1>🔊 Sound Share</h1>
      <p>Sign in or create an account to access your audio clips.</p>
    </div>

    <div id="auth-alert" class="alert alert-danger"></div>
    <div id="auth-success" class="alert alert-success"></div>

    <form id="auth-form" onsubmit="return false;">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••••••" required />
      </div>

      <div class="btn-group">
        <button type="button" id="btn-signin" class="btn-primary">Sign In</button>
        <button type="button" id="btn-signup" class="btn-secondary">Sign Up</button>
      </div>
    </form>
  </div>

  <!-- MAIN SOUND SHARE APP SCREEN -->
  <div id="app-screen" class="container hidden">
    <div class="brand">
      <h1>🔊 Sound Share</h1>
      <p>Your audio vault is active.</p>
    </div>

    <div class="user-badge">
      <p style="font-size:0.8rem; color:var(--text-muted);">Signed in as:</p>
      <strong id="user-email-display" style="color:var(--accent);">---</strong>
    </div>

    <!-- Upload Form -->
    <div class="upload-section">
      <h3 style="font-size:1rem; margin-bottom:0.75rem;">Upload New Sound</h3>
      <div id="upload-alert" class="alert alert-danger"></div>
      <div id="upload-success" class="alert alert-success"></div>

      <div class="form-group">
        <label for="clip-title">Title / Label</label>
        <input type="text" id="clip-title" placeholder="e.g., Cool Beat Drop" />
      </div>

      <div class="form-group">
        <label for="audio-file">Select Audio File (MP3, under 20MB)</label>
        <input type="file" id="audio-file" accept="audio/mpeg,audio/mp3" />
      </div>

      <button type="button" id="btn-upload" class="btn-primary" style="width:100%; margin-top:0.5rem;">
        Upload Audio
      </button>
    </div>

    <!-- Clips Section -->
    <h3 style="font-size:1rem; margin-bottom:0.5rem;">Your Sound Library</h3>
    <div id="clip-list" class="clip-list">
      <p style="color:var(--text-muted); font-size:0.85rem;" id="no-clips-msg">No audio clips uploaded yet.</p>
    </div>

    <button id="btn-signout" class="btn-danger">Sign Out</button>
  </div>

  <script src="config.js"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
