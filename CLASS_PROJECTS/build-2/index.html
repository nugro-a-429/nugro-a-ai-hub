<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound Share</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d30;
      --card-inner: #0f172a;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --border: #1e293b;
      --border-light: #334155;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, sans-serif; 
    }

    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 2rem 1rem; 
    }

    .container { 
      width: 100%; 
      max-width: 680px; 
      background-color: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 2rem; 
    }

    .brand { 
      text-align: center; 
      margin-bottom: 1.5rem; 
    }

    .brand h1 { 
      font-size: 2rem; 
    }

    .brand p { 
      color: var(--text-muted); 
      font-size: 0.9rem; 
    }

    .form-group { 
      margin-bottom: 1rem; 
    }

    label { 
      display: block; 
      font-size: 0.85rem; 
      font-weight: 600; 
      margin-bottom: 0.375rem; 
      color: var(--text-muted); 
      text-transform: uppercase; 
    }

    input[type="email"], 
    input[type="password"], 
    input[type="text"], 
    input[type="file"], 
    select { 
      width: 100%; 
      padding: 0.75rem; 
      background-color: var(--card-inner); 
      border: 1px solid var(--border-light); 
      border-radius: 8px; 
      color: var(--text-main); 
      font-size: 0.95rem; 
      outline: none; 
    }

    .btn-group { 
      display: flex; 
      gap: 0.75rem; 
      margin-top: 1.25rem; 
    }

    button { 
      flex: 1; 
      padding: 0.75rem 1rem; 
      border-radius: 8px; 
      border: none; 
      font-weight: 600; 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 0.5rem; 
    }

    .btn-primary { 
      background-color: var(--accent); 
      color: white; 
    }

    .btn-primary:hover { 
      background-color: var(--accent-hover); 
    }

    .btn-secondary { 
      background-color: transparent; 
      border: 1px solid var(--border-light); 
      color: var(--text-main); 
    }

    .btn-danger { 
      background-color: rgba(239, 68, 68, 0.15); 
      border: 1px solid var(--danger); 
      color: #fca5a5; 
    }

    .alert { 
      padding: 0.75rem 1rem; 
      border-radius: 8px; 
      font-size: 0.85rem; 
      margin-bottom: 1rem; 
      display: none; 
    }

    .alert-danger { 
      background-color: rgba(239, 68, 68, 0.15); 
      border: 1px solid var(--danger); 
      color: #fca5a5; 
    }

    .alert-success { 
      background-color: rgba(16, 185, 129, 0.15); 
      border: 1px solid var(--success); 
      color: #6ee7b7; 
    }

    .hidden { 
      display: none !important; 
    }

    .user-badge { 
      background-color: var(--card-inner); 
      padding: 0.85rem 1rem; 
      border-radius: 10px; 
      border: 1px solid var(--border-light); 
      margin-bottom: 1.5rem; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
    }

    .nav-tabs { 
      display: flex; 
      gap: 0.5rem; 
      border-bottom: 1px solid var(--border-light); 
      margin-bottom: 1.5rem; 
      padding-bottom: 0.5rem; 
    }

    .tab-btn { 
      background: none; 
      border: none; 
      color: var(--text-muted); 
      padding: 0.5rem 1rem; 
      border-radius: 6px; 
      cursor: pointer; 
    }

    .tab-btn.active { 
      background-color: var(--accent); 
      color: white; 
    }

    .speaker-controls { 
      background-color: var(--card-inner); 
      padding: 1rem; 
      border-radius: 10px; 
      border: 1px solid var(--border-light); 
      margin-bottom: 1.5rem; 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 1rem; 
    }

    .upload-section, .search-section { 
      background-color: var(--card-inner); 
      padding: 1.25rem; 
      border-radius: 10px; 
      border: 1px solid var(--border-light); 
      margin-bottom: 1.5rem; 
    }

    .clip-list { 
      display: flex; 
      flex-direction: column; 
      gap: 1rem; 
      margin-top: 1rem; 
    }

    .clip-item { 
      background-color: var(--card-inner); 
      padding: 1.25rem; 
      border-radius: 10px; 
      border: 1px solid var(--border-light); 
      display: flex; 
      flex-direction: column; 
      gap: 0.75rem; 
    }

    .clip-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }

    .clip-title { 
      font-weight: 600; 
      font-size: 1rem; 
    }

    .clip-meta { 
      display: flex; 
      gap: 0.5rem; 
      align-items: center; 
      font-size: 0.75rem; 
      color: var(--text-muted); 
    }

    .badge { 
      padding: 0.2rem 0.5rem; 
      border-radius: 4px; 
      font-weight: 600; 
      text-transform: uppercase; 
      font-size: 0.65rem; 
    }

    .badge-private { 
      background-color: #334155; 
      color: #cbd5e1; 
    }

    .badge-public { 
      background-color: #065f46; 
      color: #a7f3d0; 
    }

    .badge-shared { 
      background-color: #1e40af; 
      color: #bfdbfe; 
    }

    .btn-sm { 
      padding: 0.35rem 0.65rem; 
      font-size: 0.75rem; 
      border-radius: 6px; 
    }

    audio { 
      width: 100%; 
      height: 40px; 
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="container">
    <div class="brand">
      <h1>🔊 Sound Share</h1>
      <p>Sign in or create an account to access your audio clips.</p>
    </div>

    <div id="auth-alert" class="alert alert-danger"></div>
    <div id="auth-success" class="alert alert-success"></div>

    <form id="auth-form" onsubmit="return false;">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••••••" required />
      </div>

      <div class="btn-group">
        <button type="button" id="btn-signin" class="btn-primary">Sign In</button>
        <button type="button" id="btn-signup" class="btn-secondary">Sign Up</button>
      </div>

      <div style="text-align: center; margin: 1.25rem 0 0.75rem; color: var(--text-muted); font-size: 0.85rem;">or</div>

      <button type="button" id="btn-github" class="btn-secondary" style="width: 100%;">
        <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        Sign in with GitHub
      </button>
    </form>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen" class="container hidden">
    <div class="brand">
      <h1>🔊 Sound Share</h1>
      <p>Audio Vault & Sharing Hub</p>
    </div>

    <div class="user-badge">
      <div>
        <p style="font-size:0.75rem; color:var(--text-muted);">Signed in as</p>
        <strong id="user-email-display" style="color:var(--accent);">---</strong>
      </div>
      <button id="btn-signout" class="btn-secondary btn-sm">Sign Out</button>
    </div>

    <!-- Dual Speakers -->
    <div class="speaker-controls">
      <div>
        <label for="speaker-monitor">🎧 Monitor Speaker</label>
        <select id="speaker-monitor">
          <option value="default">Default Speaker</option>
        </select>
      </div>
      <div>
        <label for="speaker-cable">🎙️ Virtual Cable</label>
        <select id="speaker-cable">
          <option value="default">Virtual Cable</option>
        </select>
      </div>
    </div>

    <!-- Views -->
    <div class="nav-tabs">
      <button class="tab-btn active" data-view="personal">Personal Vault</button>
      <button class="tab-btn" data-view="shared">Shared With You</button>
      <button class="tab-btn" data-view="public">Public Feed</button>
    </div>

    <!-- Search Section -->
    <div class="search-section">
      <input type="text" id="search-input" placeholder="🔎 Search clips by title..." />
    </div>

    <!-- Upload Form -->
    <div id="upload-container" class="upload-section">
      <h3 style="font-size:1rem; margin-bottom:0.75rem;">Upload New Sound</h3>
      <div id="upload-alert" class="alert alert-danger"></div>
      <div id="upload-success" class="alert alert-success"></div>

      <div class="form-group">
        <label for="clip-title">Title / Label</label>
        <input type="text" id="clip-title" placeholder="e.g., Victory Sound Effect" />
      </div>

      <div class="form-group">
        <label for="clip-visibility">Visibility Setting</label>
        <select id="clip-visibility">
          <option value="private">🔒 Private (Only Me)</option>
          <option value="public">🌐 Public (Everyone)</option>
          <option value="shared">👥 Shared (Specific Users)</option>
        </select>
      </div>

      <div class="form-group hidden" id="shared-emails-group">
        <label for="shared-emails">Share with Email(s) (comma separated)</label>
        <input type="text" id="shared-emails" placeholder="friend1@example.com, friend2@example.com" />
      </div>

      <div class="form-group">
        <label for="audio-file">Select Audio File (MP3, under 20MB)</label>
        <input type="file" id="audio-file" accept="audio/mpeg,audio/mp3" />
      </div>

      <button type="button" id="btn-upload" class="btn-primary" style="width:100%;">Upload Audio</button>
    </div>

    <!-- Clips Section -->
    <div id="clip-list" class="clip-list">
      <p style="color:var(--text-muted); font-size:0.85rem;" id="no-clips-msg">No audio clips available.</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
