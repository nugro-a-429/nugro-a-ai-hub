<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound Share</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .brand {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .brand h1 {
      font-size: 1.75rem;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }

    .brand p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 0.75rem;
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    button {
      flex: 1;
      padding: 0.75rem;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
      margin-top: 1rem;
    }

    .alert {
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    .alert-danger {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }

    .alert-success {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }

    .github-space {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px dashed var(--border);
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .user-badge {
      background-color: #0f172a;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
      word-break: break-all;
    }

    .user-badge p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .user-badge strong {
      color: var(--accent);
      font-size: 0.95rem;
    }
  </style>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="container">
    <div class="brand">
      <h1>🔊 Sound Share</h1>
      <p>Sign in or create an account to access your audio clips.</p>
    </div>

    <div id="auth-alert" class="alert alert-danger"></div>
    <div id="auth-success" class="alert alert-success"></div>

    <form id="auth-form" onsubmit="return false;">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••••••" required />
      </div>

      <div class="btn-group">
        <button type="button" id="btn-signin" class="btn-primary">Sign In</button>
        <button type="button" id="btn-signup" class="btn-secondary">Sign Up</button>
      </div>
    </form>

    <!-- Placeholder reserved for GitHub sign-in button when needed later -->
    <div class="github-space">
      <p style="font-size: 0.8rem; color: var(--text-muted);">Sign in with GitHub coming soon</p>
    </div>
  </div>

  <!-- APP MAIN SCREEN -->
  <div id="app-screen" class="container hidden">
    <div class="brand">
      <h1>🔊 Sound Share</h1>
      <p>Your audio vault is active.</p>
    </div>

    <div class="user-badge">
      <p>Signed in as:</p>
      <strong id="user-email-display">---</strong>
    </div>

    <p style="font-size: 0.9rem; color: var(--text-muted); text-align: center; margin: 1.5rem 0;">
      Welcome to Sound Share! Next step: Onboarding usernames & main soundboard pads.
    </p>

    <button id="btn-signout" class="btn-danger" style="width: 100%;">Sign Out</button>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
