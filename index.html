<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Library Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Fauna+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <link rel="icon" href="icons8-google-web-search-64.png">

  <style>
    /* =========================================================
       CSS VARIABLES & THEMING (Library / Gothic Cyber Theme)
       ========================================================= */
    :root {
      --bg-color: #0b0a0d;
      --card-bg: #151319;
      --border-color: #38302e;
      --text-main: #e2d9cd;
      --text-muted: #9e8e81;
      --accent-color: #cbb06d;
      --accent-hover: #e8cd88;
      --tag-bg: #1e1a22;
      --header-bg: #110e14;
      --shelf-bg: #1a161f;
      --shelf-shadow: #000000;
      --glow: rgba(203, 176, 109, 0.25);
      --book-spine: #231b28;
    }

    [data-theme="light"] {
      --bg-color: #eaddca;
      --card-bg: #f4ede2;
      --border-color: #baa185;
      --text-main: #2b231d;
      --text-muted: #6e5e52;
      --accent-color: #8c2727;
      --accent-hover: #b83232;
      --tag-bg: #e2d3c1;
      --header-bg: #ebdcc9;
      --shelf-bg: #d9c7b0;
      --shelf-shadow: #b39f86;
      --glow: rgba(140, 39, 39, 0.2);
      --book-spine: #d3c0a8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    body {
      font-family: 'Fauna One', serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 60px;
      background-image: 
        radial-gradient(circle at 50% 0%, var(--glow), transparent 70%),
        linear-gradient(to bottom, rgba(0,0,0,0.2), transparent 400px);
      min-height: 100vh;
    }

    h1, h2, h3, .tab-btn, .theme-toggle-btn {
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    header {
      background-color: var(--header-bg);
      border-bottom: 2px solid var(--accent-color);
      padding: 2.5rem 1rem 2rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .title-area h1 {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--glow);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .title-area p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 0.3rem;
      font-style: italic;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 0.6rem 1.2rem;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .theme-toggle-btn:hover {
      background: var(--accent-color);
      color: var(--header-bg);
      box-shadow: 0 0 12px var(--glow);
    }

    .controls-container {
      max-width: 1100px;
      margin: 2rem auto 1.5rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .search-bar {
      position: relative;
      width: 100%;
    }

    .search-bar i {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent-color);
    }

    .search-bar input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 3rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 2px;
      color: var(--text-main);
      font-family: 'Fauna One', serif;
      font-size: 0.95rem;
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px var(--glow);
    }

    .filter-tabs {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 2px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent-color);
      color: var(--header-bg);
      border-color: var(--accent-color);
      box-shadow: 0 0 8px var(--glow);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* Shelf styling inspiration */
    .project-section {
      margin-bottom: 2.5rem;
      border: 1px solid var(--border-color);
      border-radius: 2px;
      background: var(--shelf-bg);
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .project-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent-color);
    }

    .section-header {
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .section-header:hover {
      background: var(--tag-bg);
    }

    .section-title-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .section-title-group i.folder-icon {
      color: var(--accent-color);
      font-size: 1.2rem;
    }

    .section-title-group h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .folder-path {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--bg-color);
      padding: 0.25rem 0.6rem;
      border-radius: 2px;
      border: 1px solid var(--border-color);
    }

    .accordion-icon {
      transition: transform 0.2s ease;
      color: var(--accent-color);
    }

    .project-section.collapsed .accordion-icon {
      transform: rotate(-90deg);
    }

    .project-section.collapsed .section-body {
      display: none;
    }

    .section-body {
      padding: 1.5rem;
      background: var(--shelf-bg);
      border-bottom: 8px solid var(--border-color); /* Shelf edge visual */
    }

    .section-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-style: italic;
      border-left: 2px solid var(--accent-color);
      padding-left: 0.8rem;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    /* Book / Tome visual theme */
    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 6px solid var(--accent-color);
      border-radius: 2px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
    }

    .project-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px var(--glow);
    }

    .project-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      color: var(--accent-color);
    }

    .project-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
      line-height: 1.5;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.2rem;
    }

    .tag {
      background: var(--tag-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border-color);
    }

    .path-tooltip {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 55%;
    }

    .btn-link {
      color: var(--header-bg);
      background: var(--accent-color);
      font-family: 'Cinzel', serif;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.4rem 0.8rem;
      border-radius: 2px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-link:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 8px var(--glow);
    }

    .no-results {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      display: none;
    }

    .no-results i {
      color: var(--accent-color);
      margin-bottom: 0.5rem;
    }

    @media (max-width: 600px) {
      .header-container {
        flex-direction: column;
        align-items: flex-start;
      }
      .folder-path {
        display: none;
      }
      .section-header {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="title-area">
        <h1 id="site-title"><i class="fa-solid fa-book-bookmark"></i> The Library</h1>
        <p id="site-subtitle">Archives & Sacred Tomes</p>
      </div>
      <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
        <span id="theme-text">Dark Mode</span>
      </button>
    </div>
  </header>

  <div class="controls-container">
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="Search books by title, contents, or tags..." />
    </div>

    <div class="filter-tabs" id="filter-tabs">
      <button class="tab-btn active" data-category="all">All Shelves</button>
    </div>
  </div>

  <main id="portfolio-container">
    </main>

  <div class="no-results" id="no-results">
    <p><i class="fa-solid fa-book-open fa-2x"></i></p>
    <p style="margin-top: 0.5rem;">No matching books found in the Library archives.</p>
  </div>

  <script>
    /* =========================================================================
       HUMAN EDIT ZONE - PORTFOLIO CONFIGURATION
       ========================================================================= */
    const PORTFOLIO_CONFIG = {
      // EDIT: Update site title and subtitle
      title: "The Great Library",
      subtitle: "Collection of Digital Tomes & Archives",

      sections: [
        {
          id: "3d-projects",                  // EDIT: Unique Section ID
          title: "3D GAMES",                  // EDIT: Section Display Name
          folderPath: "3D_PROJECTS",          // EDIT: Tier 1 Folder Name
          description: "WebGL and Three.js interactive environments and spatial archives",
          projects: [
            {
              name: "Kart Project",                     // EDIT: Project Title
              projectFolder: "kart_project",     // EDIT: Tier 2 Subfolder
              file: "kart1.html",                // EDIT: Tier 3 Target File
              description: "Interactive 3D simulation built with Three.js.",
              tags: ["Three.js", "WebGL", "Space"]     // EDIT: Search tags
            },
            {
              name: "Doom inspired Raycast",
              projectFolder: "doom",
              file: "level1.html",
              description: "3D raycast environment render.",
              tags: ["DOOM", "Canvas", "Raycast"]
            }
          ]
        },
        {
          id: "2d-projects",
          title: "2D GAMES",
          folderPath: "2D_PROJECTS",
          description: "HTML5 Canvas games, UI graphics, and digital animation",
          projects: [
          {
              name: "Anger Birds",                     // EDIT: Project Title
              projectFolder: "Angry Birds",     // EDIT: Tier 2 Subfolder
              file: "angry_birds.html",                // EDIT: Tier 3 Target File
              description: "Interactive 3D simulation built with Three.js.",
              tags: ["Three.js", "WebGL", "Space"]     // EDIT: Search tags
            }
          ]
        },
        {
          id: "utilities",
          title: "UTILITIES & TOOLS",
          folderPath: "UTILITIES",
          description: "Productivity web apps and lightweight dev tools",
          projects: [
            {
              name: "Color Palette Generator",
              projectFolder: "PALETTE_TOOL",
              file: "palette.html",
              description: "Extract color swatches directly from images.",
              tags: ["Tool", "UI", "Design"]
            }
          ]
        }
      ]
    };

    /* =========================================================================
       CORE RENDER LOGIC - DO NOT EDIT BELOW UNLESS MODIFYING FUNCTIONALITY
       ========================================================================= */
    let activeCategory = 'all';

    function initApp() {
      document.getElementById('site-title').innerHTML = `<i class="fa-solid fa-book-skull"></i> ${PORTFOLIO_CONFIG.title}`;
      document.getElementById('site-subtitle').textContent = PORTFOLIO_CONFIG.subtitle;

      renderFilterTabs();
      renderPortfolio();
      setupEventListeners();
      setupThemeToggle();
    }

    function renderFilterTabs() {
      const tabsContainer = document.getElementById('filter-tabs');
      PORTFOLIO_CONFIG.sections.forEach(sec => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.dataset.category = sec.id;
        btn.textContent = sec.title;
        tabsContainer.appendChild(btn);
      });
    }

    function renderPortfolio() {
      const container = document.getElementById('portfolio-container');
      container.innerHTML = '';

      PORTFOLIO_CONFIG.sections.forEach(sec => {
        const sectionEl = document.createElement('section');
        sectionEl.className = 'project-section';
        sectionEl.dataset.id = sec.id;

        const relativeCategoryPath = `./${sec.folderPath}/`;

        let cardsHTML = sec.projects.map(proj => {
          // Construct 3-Tier Nested Path: ./CategoryFolder/ProjectFolder/TargetFile.html
          const relativePath = `./${sec.folderPath}/${proj.projectFolder}/${proj.file}`;
          const tagsHTML = proj.tags.map(t => `<span class="tag">${t}</span>`).join('');
          
          return `
            <div class="project-card" data-search="${(proj.name + ' ' + proj.description + ' ' + proj.tags.join(' ')).toLowerCase()}">
              <div>
                <h3><i class="fa-solid fa-book-bookmark"></i> ${proj.name}</h3>
                <p>${proj.description}</p>
                <div class="tags">${tagsHTML}</div>
              </div>
              <div class="card-footer">
                <span class="path-tooltip" title="${relativePath}">${relativePath}</span>
                <a href="${relativePath}" class="btn-link" target="_blank">Open Book <i class="fa-solid fa-book-open"></i></a>
              </div>
            </div>
          `;
        }).join('');

        sectionEl.innerHTML = `
          <div class="section-header">
            <div class="section-title-group">
              <i class="fa-solid fa-box-archive folder-icon"></i>
              <h2>SHELF: ${sec.title}</h2>
              <span class="folder-path">${relativeCategoryPath}</span>
            </div>
            <i class="fa-solid fa-chevron-down accordion-icon"></i>
          </div>
          <div class="section-body">
            <p class="section-desc">${sec.description}</p>
            <div class="project-grid">
              ${cardsHTML}
            </div>
          </div>
        `;

        container.appendChild(sectionEl);
      });
    }

    function setupEventListeners() {
      document.getElementById('portfolio-container').addEventListener('click', (e) => {
        const header = e.target.closest('.section-header');
        if (header) {
          const section = header.parentElement;
          section.classList.toggle('collapsed');
          
          const icon = header.querySelector('.folder-icon');
          if (section.classList.contains('collapsed')) {
            icon.className = 'fa-solid fa-box-archive folder-icon';
          } else {
            icon.className = 'fa-solid fa-book-open-reader folder-icon';
          }
        }
      });

      document.getElementById('filter-tabs').addEventListener('click', (e) => {
        if (e.target.classList.contains('tab-btn')) {
          document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
          e.target.classList.add('active');
          activeCategory = e.target.dataset.category;
          filterProjects();
        }
      });

      document.getElementById('search-input').addEventListener('input', filterProjects);
    }

    function filterProjects() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const sections = document.querySelectorAll('.project-section');
      let totalVisibleCards = 0;

      sections.forEach(section => {
        const secId = section.dataset.id;
        const matchesCategory = (activeCategory === 'all' || activeCategory === secId);
        
        const cards = section.querySelectorAll('.project-card');
        let visibleCardsInSection = 0;

        cards.forEach(card => {
          const searchData = card.dataset.search;
          const matchesSearch = searchData.includes(query);

          if (matchesCategory && matchesSearch) {
            card.style.display = 'flex';
            visibleCardsInSection++;
          } else {
            card.style.display = 'none';
          }
        });

        if (visibleCardsInSection > 0) {
          section.style.display = 'block';
          totalVisibleCards += visibleCardsInSection;
        } else {
          section.style.display = 'none';
        }
      });

      const noResults = document.getElementById('no-results');
      noResults.style.display = (totalVisibleCards === 0) ? 'block' : 'none';
    }

    function setupThemeToggle() {
      const toggleBtn = document.getElementById('theme-toggle');
      const themeText = document.getElementById('theme-text');
      const icon = toggleBtn.querySelector('i');

      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeUI(savedTheme);

      toggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeUI(newTheme);
      });

      function updateThemeUI(theme) {
        if (theme === 'light') {
          icon.className = 'fa-solid fa-sun';
          themeText.textContent = 'Light Mode';
        } else {
          icon.className = 'fa-solid fa-moon';
          themeText.textContent = 'Dark Mode';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
